name: Update AI Hub and publish site

on:
  # 7:00 AM and 7:00 PM India time (01:30 and 13:30 UTC).
  schedule:
    - cron: "30 1,13 * * *"
  # Lets you press "Run workflow" on the Actions tab any time.
  workflow_dispatch:
  # Re-publish the site whenever you edit and push your own content.
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-hub
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: pip

      - name: Fetch AI news
        if: github.event_name != 'push'
        run: |
          pip install -r requirements.txt
          python scripts/fetch_ai_news.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save the new data to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "ai-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "AI Hub update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
